{% extends 'store/base.html' %}{% load static %}{% block content %}<div class="detail">{% if product.image %}<img src="{{product.image.url}}" alt="{{product.name}}">{% else %}<img src="{% static 'images/product' %}{{ product.id }}.svg" alt="{{product.name}}">{% endif %}<div><h1>{{product.name}}</h1><p class="price">₹{{product.price}}</p><p>{{product.description}}</p><p><b>Stock:</b> {{product.stock}}</p><form method="post" action="{% url 'add_to_cart' product.id %}">{% csrf_token %}<label>Quantity <input type="number" name="quantity" min="1" max="{{product.stock}}" value="1"></label><button class="btn" {% if product.stock == 0 %}disabled{% endif %}>Add to Cart</button></form></div></div>{% endblock %}
